name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - name: Diagnose Prettier output (temporary)
        run: |
          echo 'STILL_FORMAT_START'
          npx prettier src/App.tsx | jq -Rs .
          echo 'STILL_FORMAT_END'
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
